    <script>
      /*u => ({id: u.id, name: u.name})

      // 数组使用复数命名 numbers
      const numbers = [5, 8, 12, 44, 130, 6];
      // 形参命名使用简化： index ele arr
      const callbackFn = (index, ele, number) => {
        //都是形参
        console.log(index, ele, number);
        return ele > 10; //如果是找索引为偶数,条件换成index % 2 === 0
      };
      const newArr = number.filter(callbackFn); //形参 只和位置有关
      // const newArr = number.filter((qwe,ele,qwekk) => qwe > 10)
      console.log(newArr);

      // 形参只和位置有关的情况（除了回调函数）:
      // 1. 普通函数调用 - 参数按位置传递
      function greet(name, age, city) {
        console.log(`${name}, ${age}, ${city}`)
      }
      greet("Alice", 25, "Beijing") // 位置对应: name=Alice, age=25, city=Beijing
      // greet(25, "Alice", "Beijing") // 错误: 位置不对应

      // 2. 方法调用 - 对象方法参数按位置传递
      const obj = {
        introduce: function(name, age) {
          console.log(`${name} is ${age}`)
        }
      }
      obj.introduce("Bob", 30) // 位置对应

      // 3. 构造函数调用 - new 调用时参数按位置传递
      function Person(name, age) {
        this.name = name
        this.age = age
      }
      const person = new Person("Charlie", 35) // 位置对应

      // 4. apply/call 调用 - 虽然可以改变this,但参数仍然按位置传递
      function add(a, b, c) {
        return a + b + c
      }
      add.apply(null, [1, 2, 3]) // 位置对应: a=1, b=2, c=3
      add.call(null, 1, 2, 3) // 位置对应

      // 5. 默认参数 - 虽然有默认值,但位置仍然重要
      function calculate(a, b = 10, c = 20) {
        return a + b + c
      }
      calculate(1) // a=1, b=10(默认), c=20(默认)
      calculate(1, 2) // a=1, b=2, c=20(默认)
      // 不能跳过中间参数: calculate(1, , 3) // 语法错误
      calculate(1, undefined, 3) // a=1, b=10(默认), c=3 - 需要用undefined占位

      // 6. 剩余参数 - 虽然用...args,但前面的参数仍然按位置
      function sum(first, second, ...rest) {
        return first + second + rest.reduce((a, b) => a + b, 0)
      }
      sum(1, 2, 3, 4, 5) // first=1, second=2, rest=[3,4,5]

      // 注意: JavaScript没有命名参数(除了对象解构),所有参数都是位置参数
      // 对象解构可以模拟命名参数:
      function createUser({ name, age, city }) {
        console.log(`${name}, ${age}, ${city}`)
      }
      createUser({ age: 25, city: "Shanghai", name: "David" }) // 顺序无关,按属性名匹配

      //课后作业:在数组里索引为偶数的函数 利用 filter

    return index % 2 === 0

console.log(evenIndexArr2)

      /*//总结

// method1: idx
const evenIndexEle = numbers.filter((ele, index) => { //应该忽略ele,未使用会报错
    return index % 2 === 0
})

// method2:换种写法

//method3:bit operation(实际工作中几乎不会用)

console.log(evenIndexElements3) 
*/

      //课后作业：哪些方法改变原数组 哪些不改变
      const arr = [1, 2, 3, 4, 5];
      //1.不改变原数组
      //map()
      const mapped = arr.map((x) => x * 2);
      console.log(arr); // [1, 2, 3, 4, 5]

      //slice()
      const sliced = arr.slice(1, 3);
      console.log(arr); // [1, 2, 3, 4, 5]

      //concat()
      const concated = arr.concat([6, 7]);
      console.log(arr); // [1, 2, 3, 4, 5]

      //reduce(callbackFn, initialValue) 考点
      const sum = arr.reduce((acc, curr) => acc + curr, 0);
      console.log(arr); // [1, 2, 3, 4, 5]

      // some() - 存在性检查
      const allPositive = arr.every((x) => x > 0);
      console.log(arr); // [1, 2, 3, 4, 5]

      // find()
      const found = arr.find((x) => x > 3);
      console.log(arr); // [1, 2, 3, 4, 5]

      // flat()
      const nested = [
        [1, 2],
        [3, 4],
      ];
      const flattened = nested.flat();
      console.log(nested); // [[1, 2], [3, 4]]

      //2.改变原数组
      //push() 添加元素到数组末尾
      arr.push(6);
      console.log(arr); // [1, 2, 3, 4, 5, 6]

      //pop() 删除数组末尾的元素
      arr.pop();
      console.log(arr); // [1, 2, 3, 4, 5]

      //shift() 删除数组开头元素
      arr.shift();
      console.log(arr); // [2, 3, 4, 5]

      // unshift() - 添加元素到开头
      arr.unshift(0);
      console.log(arr); // [0, 1, 2, 3, 4, 5]

      // splice(start, deleteCount, item1) - 删除/插入元素 经常用
      arr.splice(1, 2, "a", "b");
      console.log(arr); // [1, 'a', 'b', 4, 5]

      // sort() - 排序
      arr.sort((a, b) => b - a);
      console.log(arr); // [5, 4, 'b', 'a', 1]

      // reverse() - 反转
      arr.reverse();
      console.log(arr); // [1, 'a', 'b', 4, 5]

      // fill() - 填充
      arr.fill(0);
      console.log(arr); // [0, 0, 0, 0, 0]

      //developer tools
