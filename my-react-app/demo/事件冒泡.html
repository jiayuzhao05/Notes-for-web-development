<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>事件冒泡和捕获</title>
  <style>
    .outer { 
      padding: 40px; 
      background: #e6f0ff;
      border: 2px solid #007bff;
      margin: 20px;
    }
    .middle { 
      padding: 40px; 
      background: #cfe8ff;
      border: 2px solid #0056b3;
    }
    .inner { 
      padding: 40px; 
      background: #b3dbff; 
      cursor: pointer;
      border: 2px solid #004085;
    }
    
    .log-container {
      margin: 20px;
      padding: 20px;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 5px;
    }
    
    .log-container h3 {
      margin-top: 0;
      color: #495057;
    }
    
    .log-output {
      background: #000;
      color: #00ff00;
      padding: 10px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      min-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="outer">
    <h2>outer</h2>
    <div class="middle">
      <h3>middle</h3>
      <div class="inner">
        <h4> inner - click me！</h4>
        <p>事件冒泡和捕获顺序</p>
      </div>
    </div>
  </div>

  <div class="log-container">
    <h3>控制台输出：</h3>
    <div id="log-output" class="log-output"></div>
    <button onclick="clearLog()">清空日志</button>
    <button onclick="toggleStopPropagation()">切换阻止冒泡</button>
  </div>

  <script>
    let stopPropagation = false;
    
    // 自定义log函数，输出到控制台和页面
    const log = msg => {
      console.log(msg);
      const logOutput = document.getElementById('log-output');
      const timestamp = new Date().toLocaleTimeString();
      logOutput.innerHTML += `[${timestamp}] ${msg}<br>`;
      logOutput.scrollTop = logOutput.scrollHeight;
    };

    // 清空日志函数
    const clearLog = () => {
      document.getElementById('log-output').innerHTML = '';
    };

    // 切换阻止冒泡
    const toggleStopPropagation = () => {
      stopPropagation = !stopPropagation;
      log(`阻止冒泡: ${stopPropagation ? '开启' : '关闭'}`);
    };

    // 捕获阶段 (Capture Phase) 
    // 事件从外层向内层传播：outer → middle → inner
    log('=== 设置事件监听器 ===');
    
    document.querySelector('.outer').addEventListener('click', (e) => {
      log('outer (capture) - 捕获阶段');
    }, true);
    
    document.querySelector('.middle').addEventListener('click', (e) => {
      log('middle (capture) - 捕获阶段');
    }, true);
    
    document.querySelector('.inner').addEventListener('click', (e) => {
      log('inner (capture) - 捕获阶段');
    }, true);

    // 冒泡阶段 (Bubbling Phase) 
    // 事件从内层向外层传播：inner → middle → outer
    document.querySelector('.outer').addEventListener('click', (e) => {
      log('outer (bubble) - 冒泡阶段');
    });
    
    document.querySelector('.middle').addEventListener('click', (e) => {
      log('middle (bubble) - 冒泡阶段');
    });
    
    document.querySelector('.inner').addEventListener('click', (e) => {
      log('inner (bubble) - 冒泡阶段');
      
      // 根据设置决定是否阻止冒泡
      if (stopPropagation) {
        e.stopPropagation();
        log('🚫 已阻止事件冒泡');
      }
    });

    // 页面加载完成提示
    window.addEventListener('load', () => {
      log('页面加载完成，点击内层元素查看事件流程');
    });
  </script>
</body>
</html>
