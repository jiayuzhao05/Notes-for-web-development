<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>password box</title>
  <style>
    .mi-form {
      display: table;
      width: 356px;
      height: 60px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0);
      background-color: #f9f9f9;
    }

    .mi-control {
      position: relative;
      display: table-cell;
      width: 294px;
    }

    .mi-input {
      box-sizing: border-box;
      width: 100%;
      height: 60px;
      border: 0;
      padding: 30px 20px 10px;
      outline: none;
      background: none;
      appearance: none;
      font-size: 17px;
      font-family: "Noto Color Emoji";
      color: #333;
      line-height: 20px;
    }


    .mi-control label {
      user-select: none;
      position: absolute;
      top: 20px;
      left: 20px;
      height: 20px;
      font-weight: 400;
      font-size: 17px;
      color: rgba(0, 0, 0, .4);
      line-height: 20px;
      transition: top .15s cubic-bezier(.4, 0, .2, 1), font-size .15s cubic-bezier(.4, 0, .2, 1), color .15s cubic-bezier(.4, 0, .2, 1);
      max-width: calc(100% - 20px);
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .mi-control label.above {
      top: 6px;
      font-size: 12px;
      color: #aaa;
    }

    .mi-password {
      display: table-cell;
      width: 60px;
      color: rgba(0, 0, 0, .85);
      font-size: 14px;
      vertical-align: middle;
    }

    .mi-password svg {
      width: 20px;
      height: 20px;
      margin: 10px 20px
    }
  </style>
</head>

<body>
  <div class="mi-form">
    <div class="mi-control">
      <input type="password" class="mi-input">
      <label>password</label>
    </div>
    <div class="mi-password">  <!-- 字母 o 和圆形  -->
        <svg width="24" height="24" viewBox="0 0 24 24">
            <text x="12" y="16" text-anchor="middle" font-size="14" fill="currentColor">o</text>
          </svg>
          <svg width="24" height="24" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
    </div>
  </div>
  <script>
// x="12": 文本锚点的 x 坐标为 12
// y="16": 文本基线的 y 坐标为 16（基线，不是文字顶部）
// text-anchor="middle": 文本锚点为中间对齐
// font-size="14": 文本大小为 14
// fill="currentColor": 文本颜色为当前颜色
// cx="12": 圆形中心点的 x 坐标为 12
// cy="12": 圆形中心点的 y 坐标为 12
// r="8": 圆形半径为 8
// fill="none": 圆形填充为无
// stroke="currentColor": 圆形边框颜色为当前颜色
// stroke-width="2": 圆形边框宽度为 2
  </script>
</body>

</html>
