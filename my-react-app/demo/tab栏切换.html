<!DOCTYPE html>
<html>

<head lang="en">
  <meta charset="UTF-8" />
  <title></title>
  <style type="text/css">
    * {
      margin: 0;
      padding: 0;
    }

    ul {
      list-style: none;
    }

    .wrapper {
      width: 1000px;
      height: 475px;
      margin: 0 auto;
      margin-top: 100px;
    }

    .tab {
      border: 1px solid #ddd;
      border-bottom: 0; 
      height: 36px;
      width: 320px;
    }

    .tab li {
      position: relative;
      float: left;
      width: 80px;
      height: 34px;
      line-height: 34px;
      text-align: center;
      cursor: pointer;
      border-top: 4px solid #fff;
    }

    .tab span {
      position: absolute;
      right: 0;
      top: 10px;
      background: #ddd;
      width: 1px;
      height: 14px;
      overflow: hidden;
    }

    .products {
      width: 1002px;
      border: 1px solid #ddd;
      height: 476px;
    }

    .products .main {
      float: left;
      display: none;
    }

    .products .main.active {
      display: block;
    }

    .tab li.active {
      border-color: red; /* 边框变红 */
      border-bottom: 0; /* 与内容面板无缝连接 */
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <ul class="tab">
      <li class="tab-item active">landscape</li>
      <li class="tab-item">architecture</li>
      <li class="tab-item">nature</li>
      <li class="tab-item">Art Deco</li>
    </ul>
    <div class="products">
      <div class="main active">
        <a href="###"><img src="https://picsum.photos/seed/luxury-cosmetics/1000/476" alt="" /></a>
      </div>
      <div class="main">
        <a href="###"><img src="https://picsum.photos/seed/chinese-cosmetics/1000/476" alt="" /></a>
      </div>
      <div class="main">
        <a href="###"><img src="https://picsum.photos/seed/cleaning-products/1000/476" alt="" /></a>
      </div>
      <div class="main">
        <a href="###"><img src="https://picsum.photos/seed/mens-fashion/1000/476" alt="" /></a>
      </div>
    </div>
  </div>
  <script>
    // 获取 DOM：tabs包含4个标签按钮nodelist；panes包含4个内容面板nodelist
    const tabs = document.querySelectorAll('.tab-item')
    const panes = document.querySelectorAll('.products .main')

    // tabs/panes 分别取到所有“标签按钮”和对应的“内容面板”，两者下标一一对应
    tabs.forEach((tab, index) => { // foreach 给每个标签绑定点击处理
      tab.addEventListener('click', () => { // tab当前便利标签元素；index 当前标签索引位置（0,1,2,3）
        document.querySelector('.tab li.active')?.classList.remove('active') // 2. 移除当前显示的内容面板
        document.querySelector('.products .main.active')?.classList.remove('active')
        tab.classList.add('active') // 3. 激活当前点击的标签
        panes[index].classList.add('active') // 4. 给与之同下标的 pane（内容面板）加上 active,显示对应内容面板？？？？？
      })
    })
    // 点击标签按钮时，先干掉所有“活动标签”和“活动面板”
    // document.querySelector('.tab li.active') 找到当前已激活的标签项并移除 active
    // document.querySelector('.products .main.active') 找到当前显示的内容面板并移除 active
    // 把当前点击tab加上active(边框变红，表现为“选中态”), 把与之同下标的 pane（内容面板）加上 active(display: block，所以它显示出来)
  </script>
</body>

</html>
