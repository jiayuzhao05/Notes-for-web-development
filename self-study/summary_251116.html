        ((x) => x(x))(

            (f, ...args) =>
              args.length >= fn.length

      // 记忆化
      const memo = (fn) => {
        const cache = new Map();
        return (...args) => {
          const key = JSON.stringify(args);
          if (cache.has(key)) return cache.get(key);
          const val = fn(...args);
          cache.set(key, val);
          return val;

      // 防抖：停止触发后等待 N ms 才执行（如输入框）
      const debounce = (fn, wait = 300) => {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), wait);
        };
      };

      // 节流：间隔 N ms 执行一次（如滚动）
      const throttle = (fn, wait = 300) => {
        let last = 0,
          timer;
        return (...args) => {
          const now = Date.now();
          if (now - last >= wait) {
            last = now;
            fn(...args);
          } else if (!timer) {
            timer = setTimeout(() => {
              last = Date.now();
              timer = null;
              fn(...args);
            }, wait - (now - last));
          }
        };
      };
