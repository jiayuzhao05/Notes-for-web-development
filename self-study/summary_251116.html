          // 5. 手动实现深拷贝需要考虑循环引用检测
          function deepClone(obj, visited = new WeakMap()) {
            // 处理基本类型和null
            if (obj === null || typeof obj !== "object") return obj
            
            // 检测循环引用
            if (visited.has(obj)) {
              return visited.get(obj) // 返回已访问过的引用
            }
            
            // 处理Date
            if (obj instanceof Date) return new Date(obj)
            
            // 处理RegExp
            if (obj instanceof RegExp) return new RegExp(obj)
            
            // 处理数组
            if (Array.isArray(obj)) {
              const cloned = []
              visited.set(obj, cloned) // 记录访问
              obj.forEach(item => {
                cloned.push(deepClone(item, visited))
              })
              return cloned
            }
            
            // 处理对象
            const cloned = {}
            visited.set(obj, cloned) // 记录访问,防止循环引用
            for (let key in obj) {
              if (obj.hasOwnProperty(key)) {
                cloned[key] = deepClone(obj[key], visited)
              }
            }
            return cloned
          }
          
          // 使用WeakMap记录已访问的对象,避免循环引用导致的无限递归

          // 记忆化 memoization 给纯函数加一层缓存 相同参数只算一次 下次直接用记住的结果 减少重复计算
          const memo = (fn) => { //记忆化高阶函数memo接收函数fn 返回新函数 “带缓存版本”
            const cache = new Map(); //缓存容器map（key-value） 存储参数和结果

          // 关键区别总结:

          const debounce = (fn, wait = 300) => {

            let last = 0,
              timer;
            return (...args) => {
              const now = Date.now();
              if (now - last >= wait) {
                last = now;
                fn(...args);
              } else if (!timer) {
                timer = setTimeout(() => {
                  last = Date.now();
                  timer = null;
                  fn(...args);
                }, wait - (now - last));

             if(signal?.aborted) return rej(new DOMException("Aborted","AbortError"));
             const onAbort = () => rej(new DOMException("Aborted","AbortError"));
             signal?.addEventListener("abort", onAbort, {once:true});

          //类定义阶段运行，不在实例化阶段
