<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        const socket = io('ws://localhost:9527')
        socket.on('$UpdateUser', (users)=>{
            console.log('event $UpdateUser occurred',users)
        })

        socket.on('$Name', (name)=>{
            console.log('event $Name occurred',name)
        })
    </script>
</body>
</html>
