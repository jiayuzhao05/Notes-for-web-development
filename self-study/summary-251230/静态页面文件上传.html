<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="upload.php" method="post" enctype="multipart/form-data">
        <input type="file" name="file">
        <input type="submit" value="上传">
    </form>
    <script>
        const doms= {
            username: document.querySelector('#username'),
            password: document.querySelector('#password'),
            btnUpload: document.querySelector('#btnUpload'),
            fileUploader: document.querySelector('#fileUploader'),
            submit: document.querySelector('.submit'),
        }

        doms.btnUpload.onclick = function(){
            doms.fileUploader.click()
        }
        doms.fileUploader.onchange = function(){
            //一般先对文件进行验证
            console.log(doms.fileUploader.files[0])
            //上传文件
            const formData = new FormData()
            formData.append('file', doms.fileUploader.files[0]) //添加键值对(‘file’,文件二进制数据)

        fetch('http://localhost:8000/api/upload', {
            method: 'POST',
            body: formData,
        }).then(resp=>resp.json())
        doms.avatar.src = resp.data
    }

    doms.submit.onclick = asyncfunction(e){
        const resp = await fetch('http://localhost:8000/api/login', {
            method: 'POST',
            headers:{
                'Content-Type': 'application/json',
            }
            body: JSON.stringify({
                username: doms.username.value,
                password: doms.password.value,
                avatar: doms.avatar.src,
            }),
        }).then(resp=>resp.json())
        console.log(resp)
    }
    </script>
</body>
</html>
