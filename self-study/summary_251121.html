    <script>
      //隐式绑定（implicit binding） 和 显式绑定（explicit binding）
      //implicit: obj.fn()
      const obj = {
        value: 100,
        show: function () {
          console.log(this.value);
        },
      };
      obk.show(); //100 this===obj
      // 坑：丢失隐式绑定
      const fn = obj.show;
      fn(); //undefined this指向window不是 obj

      //explicit: call,apply,bind
      function greet(greeting, punctuation) {
        console.log(greeting + this.name + punctuation);
      }
      greet.call(user, "Hello", "!"); //Hello obj.name !
      greet.apply(user, ["Hello", "!"]); //Hello obj.name !
      const bound = greet.bind(user, "Yo");
      bound("?"); //Yo user.name ?

      //new绑定（new binding）
      function Person(name, age) {
        this.name = name;
        this.age = age;
      }
      const person = new Person("John", 20); //this===person
      //new绑定优先级高于显式绑定,如果函数new调用，this强制绑定到新对象

      //this binding

      //函数式编程
      [1, 2, 3].map((x) => x * 2); //[2,4,6]
      // map()是数组告诫函数 转换数组中每个元素 遍历数组每个元素 对每个函数执行函数 返回新数组 原数组不修改
      // 应用
      const prices = [100, 200, 300];
      const discountedPrices = prices.map((price) => price * 0.9);
      console.log(discountedPrices); //[90,180,270]

      const names = ["Alice", "Bob", "Charlie"];
      const capitalizedNames = names.map(
        (name) => name.charAt(0).toUpperCase() + name.slice(1)
      );
      // const capitalizedNames = names.map(name => name.toUpperCase());
      console.log(capitalizedNames); //['Alice','Bob','Charlie']

      //工厂函数 不用 new，通过闭包保存私有变量
      function createCounter() {
        let count = 0;
        return {
          inc() {
            count++;
            console.log(count);
          },
          get() {
            return count;
          },
        };
      }

      const c1 = createCounter();
      c1.inc(); // 1
      c1.inc(); // 2

      //静态方法 vs 实例方法 vs 动态方法
      //static 定义在类本身上，直接通过 ClassName.method() 调用。不依赖具体实例
      class MathUtil {
        static add(a, b) {
          return a + b;
        }
      }
      MathUtil.add(1, 2); // 3

      //实例方法 定义在类的 prototype 上，必须通过实例调用，如 instance.method()
      class Counter {
        constructor() {
          this.count = 0;
        }
        inc() {
          this.count++; //this 指向实例，可访问实例状态
          return this.count;
        }
      }
      const c = new Counter();
      c.inc(); // 1

      //动态方法 不是语法层的“dynamic”，而是“在运行时决定”的方法定义方式
      const methodName = "sayHello";
      class Greeter {
        [methodName]() {
          return "hi";
        }
      }

      //2. 实例上直接赋值函数（每个实例有自己的方法拷贝）：
      function Person(name) {
        this.name = name;
        this.say = function () {
          return this.name;
        };
      }

      //依赖注入/反射 DI, Dependency Injection 设计模式，“从外部提供依赖”
      //在运行时，将依赖对象注入到对象中，而不是在编译时注入
      // 支持作用域（单例、临时等）、生命周期钩子
      class Logger {
        log(msg) {
          console.log(msg);
        }
      }
      class UserService {
        constructor(logger) {
          // 依赖注入进来
          this.logger = logger;
        }
        login() {
          this.logger.log("login");
        }
      }

      // 注入方式：手动或由框架 DI 容器负责
      const logger = new Logger();
      const service = new UserService(logger);
