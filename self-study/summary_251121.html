  <body>
    <script>
      //隐式绑定（implicit binding） 和 显式绑定（explicit binding）
      //implicit: obj.fn()
      const obj = {
        value: 100,
        show: function () {
          console.log(this.value);
        },
      };
      obk.show(); //100 this===obj
      // 坑：丢失隐式绑定
      const fn = obj.show;
      fn(); //undefined this指向window不是 obj

      //explicit: call,apply,bind
      function greet(greeting, punctuation) {
        console.log(greeting + this.name + punctuation);
      }
      greet.call(user, "Hello", "!"); //Hello obj.name !
      greet.apply(user, ["Hello", "!"]); //Hello obj.name !
      const bound = greet.bind(user, "Yo");
      bound("?"); //Yo user.name ?

      //new绑定（new binding）
      function Person(name, age) {
        this.name = name;
        this.age = age;
      }
      const person = new Person("John", 20); //this===person
      //new绑定优先级高于显式绑定,如果函数new调用，this强制绑定到新对象

      //this

      //函数式编程
      [1, 2, 3].map((x) => x * 2); //[2,4,6]
      // map()是数组告诫函数 转换数组中每个元素 遍历数组每个元素 对每个函数执行函数 返回新数组 原数组不修改
      // 应用
      const prices = [100, 200, 300];
      const discountedPrices = prices.map((price) => price * 0.9);
      console.log(discountedPrices); //[90,180,270]

      const names = ["Alice", "Bob", "Charlie"];
      const capitalizedNames = names.map(
        (name) => name.charAt(0).toUpperCase() + name.slice(1)
      );
      // const capitalizedNames = names.map(name => name.toUpperCase());
      console.log(capitalizedNames); //['Alice','Bob','Charlie']

      //记忆化

      //高阶函数

      //工厂函数 不用 new，通过闭包保存私有变量
      function createCounter() {
        let count = 0;
        return {
          inc() {
            count++;
            console.log(count);
          },
          get() {
            return count;
          },
        };
      }

      const c1 = createCounter();
      c1.inc(); // 1
      c1.inc(); // 2
    </script>
