<!doctype html>
<!-- 声明文档类型为 HTML5 -->
<html lang="zh-CN">
  <!-- 根元素，包含整个页面 -->
  <head>
    <!-- 头部，包含元数据 -->
    <meta charset="UTF-8" />
    <!-- 元数据（字符集、视口等）-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的网页</title>
    <!-- 浏览器标签页标题 -->
    <link rel="stylesheet" href="style.css" />
    <!-- 链接外部资源（CSS、图标）-->
    <style>
      /* 内部css样式 */
    </style>
  </head>
  <body>
    <!-- 页面内容 -->
    <script>
      <!-- JavaScript 代码 -->
    </script>
    <h1>一级标题</h1>
    <!-- 最重要，通常每页一个 -->
    <h2>二级标题</h2>
    <h3>三级标题</h3>
    <h4>四级标题</h4>
    <h5>五级标题</h5>
    <h6>六级标题</h6>
    <!-- 最小标题 -->

    <p>这是一个段落</p>
    <!-- 段落 -->
    <br />
    <!-- 换行 -->
    <hr />
    <!-- 水平分隔线 -->

    <strong>加粗文本</strong>
    <!-- 重要文本（加粗）-->
    <b>粗体文本</b>
    <!-- 纯视觉加粗 -->

    <em>强调文本</em>
    <!-- 强调（斜体）-->
    <i>斜体文本</i>
    <!-- 纯视觉斜体 -->

    <u>下划线文本</u>
    <!-- 下划线 -->
    <s>删除线文本</s>
    <!-- 删除线 -->

    <mark>高亮文本</mark>
    <!-- 高亮标记 -->
    <small>小号文本</small>
    <!-- 小字体 -->

    <sub>下标</sub>
    <!-- H₂O 的 2 -->
    <sup>上标</sup>
    <!-- X² 的 2 -->

    <code>代码片段</code>
    <!-- 行内代码 -->
    <pre>预格式化文本</pre>
    <!-- 保留空格和换行 -->

    <p>这是一个<strong>重要</strong>的段落。</p>
    <p>水的化学式是 H<sub>2</sub>O</p>
    <p>2 的平方是 2<sup>2</sup> = 4</p>
    <p>使用 <code>console.log()</code> 打印信息</p>

    <main>
      <article>
        <h2>文章标题</h2>
        <p>发布于 <time datetime="2026-02-08">2026年2月8日</time></p>
        <p>文章内容...</p>
      </article>
    </main>

    <footer>
      <p>联系方式: <a href="mailto:me@example.com">me@example.com</a></p>
    </footer>

    <div class="container">
      <p>这是一个<span style="color: red">红色</span>的词。</p>
    </div>

    <!-- 换行和空格 -->
    <br />
    <!-- 换行 -->
    &nbsp;
    <!-- 空格（HTML 实体）-->

    <!-- 注释 -->
    <!-- 这是注释，不会显示在页面上 -->

    <!-- 引用 -->
    <blockquote>
      <!-- 块引用 -->
      这是一段引用的文字
    </blockquote>

    <q>行内引用</q>
    <!-- 行内引用 -->
  </body>
</html>
