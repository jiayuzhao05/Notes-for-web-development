<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="never" />
  <title>存储播放时间</title>
  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    .container {
      width: 1200px;
      margin: 0 auto;
    }

    .video video {
      width: 100%;
      padding: 20px 0;
    }

    .elevator {
      position: fixed;
      top: 280px;
      right: 20px;
      z-index: 999;
      background: #fff;
      border: 1px solid #e4e4e4;
      width: 60px;
    }

    .elevator a {
      display: block;
      padding: 10px;
      text-decoration: none;
      text-align: center;
      color: #999;
    }

    .elevator a.active {
      color: #1286ff;
    }

    .outline {
      padding-bottom: 300px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <a href="http://pip.itcast.cn">
        <img src="https://pip.itcast.cn/img/logo_v3.29b9ba72.png" alt="" />
      </a>
    </div>
    <div class="video">
      <video src="https://v.itheima.net/LapADhV6.mp4" controls></video>
    </div>
    <div class="elevator">
      <a href="javascript:;" data-ref="video">视频介绍</a>
      <a href="javascript:;" data-ref="intro">课程简介</a>
      <a href="javascript:;" data-ref="outline">评论列表</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  <script>
    // 1. 获取元素 对视频进行操作
    const video = document.querySelector('video')
    video.ontimeupdate = _.throttle(() => {
    // video.ontimeupdate 事件在视频播放位置改变时触发 触发频率非常频（250ms/次）用来监听视频播放进度
    // _.throttle()：使用 lodash 库的节流函数，每隔一段时间执行一次（1000ms）
      // console.log(video.currentTime) 获得当前视频时间
      // 把当前的时间存储到本地存储
      // localStorage.setItem()用法：访问当前域名下本地 Storage 对象，通过 Storage.setItem() 增加一个数据项目
      localStorage.setItem('currentTime', video.currentTime) //video.currentTime 获取视频当前播放位置（s）存储在浏览器的 localStorage 对象中
    }, 1000)

    // 打开页面触发事件，从本地存储里面取出记录时间， 赋值给video.currentTime
    //video.onloadData 在视频数据加载完成触发，视频可以播放，确保视频对象已准备好接收 currentTime 设置
    video.onloadeddata = () => {
      // console.log(111)
      video.currentTime = localStorage.getItem('currentTime') || 0
    }
    //localStorage.getItem()：读取 localStorage. 数据保存在浏览器中，关闭页面不丢失，不同网站数据独立（域名隔离），容量限制在 5-10MB
    // 如果同步操作会阻塞主线程
    // || 0：如果 localStorage 中没有记录时间，则赋值为 0
    // video.currentTime 设置视频播放位置
    

  </script>
</body>

</html>
