      //课后作业：哪些方法改变原数组 哪些不改变
      const arr = [1, 2, 3, 4, 5];
      //1.不改变原数组
      //map()
      const mapped = arr.map((x) => x * 2);
      console.log(arr); // [1, 2, 3, 4, 5]

      //slice()
      const sliced = arr.slice(1, 3);
      console.log(arr); // [1, 2, 3, 4, 5]

      //concat()
      const concated = arr.concat([6, 7]);
      console.log(arr); // [1, 2, 3, 4, 5]

      //reduce(callbackFn, initialValue) 考点
      const sum = arr.reduce((acc, curr) => acc + curr, 0);
      console.log(arr); // [1, 2, 3, 4, 5]

      // some() - 存在性检查
      const allPositive = arr.every((x) => x > 0);
      console.log(arr); // [1, 2, 3, 4, 5]

      // find()
      const found = arr.find((x) => x > 3);
      console.log(arr); // [1, 2, 3, 4, 5]

      // flat()
      const nested = [
        [1, 2],
        [3, 4],
      ];
      const flattened = nested.flat();
      console.log(nested); // [[1, 2], [3, 4]]

      //2.改变原数组
      //push() 添加元素到数组末尾
      arr.push(6);
      console.log(arr); // [1, 2, 3, 4, 5, 6]

      //pop() 删除数组末尾的元素
      arr.pop();
      console.log(arr); // [1, 2, 3, 4, 5]

      //shift() 删除数组开头元素
      arr.shift();
      console.log(arr); // [2, 3, 4, 5]

      // unshift() - 添加元素到开头
      arr.unshift(0);
      console.log(arr); // [0, 1, 2, 3, 4, 5]

      // splice(start, deleteCount, item1) - 删除/插入元素 经常用
      arr.splice(1, 2, "a", "b");
      console.log(arr); // [1, 'a', 'b', 4, 5]

      // sort() - 排序
      arr.sort((a, b) => b - a);
      console.log(arr); // [5, 4, 'b', 'a', 1]

      // reverse() - 反转
      arr.reverse();
      console.log(arr); // [1, 'a', 'b', 4, 5]

      // fill() - 填充
      arr.fill(0);
      console.log(arr); // [0, 0, 0, 0, 0]
