<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>login</h1>
    <form action="" method="get">
      <label>email <input id="email" type="email" name="email" /></label>
      <label>
        password <input id="password" type="password" name="password"
      /></label>
      <button type="submit">Login</button>
      <button type="reset">reset</button>
    </form>
    <script>
      const form = document.querySelector("form");
      const emailInput = document.getElementById("email");
      const pasawordInput = document.getElementById("password");

      form.addEventListener('submit', (e)=>{
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if(!email || !password)
        {
          alert("Please fill in password and email");
          return;
        }

        const loginData = {email, password};

        const jsonBody = JSON.stringify(loginData);

        localstorage.setItem('lastEmail', email);

        try{
          const response = await fetch('https://api.example.com/login', {
            method:'POST',
            headers:{
              'Content-Type': 'application/json',
            },
            body: jsonBody,
          });

          const result = await response.json();
          if(!response.ok){
            alert(result.message || 'Login failed');
            return;
          }

          if(result.token){
            sessionStorage.setItem('token', result.token);
          }
          alert('Login successful');
        } catch(error){
          alert('login failed');
        }
        })

        const saved = localstorage.getItem('lastEmail');
        if (saved) emailInput.value = saved;
    </script>
  </body>
</html>
