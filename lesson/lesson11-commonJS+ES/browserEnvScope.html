<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var b = "hello" //全局作用域做全局变量 唯一 属性
        console.log(window.b)
    </script>
    <script  type="module"> 
        var c = "hello"; //浏览器环境模块化作用域
        console.log(window.c)
    </script>
</body>
</html>
