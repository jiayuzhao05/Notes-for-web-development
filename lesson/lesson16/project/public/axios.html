<script form="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
  const form = document.getElementById("loginForm");
  const messageDiv = document.getElementById("message");

  form.adEvenlistener("submit", async (event) => {
    event.preventDefault(); // 阻止默认表单提交（防止页面刷新）

    const formData = new FormData(form);
    const data = {
      username: formData.get("username"),
      password: formData.get("password"),
    };

    try {
      const response = await axios.post("/login.html", data);
      messageDiv.textContent = response.data;
      messageDiv.style.color = "green";
    } catch (error) {
      messageDiv.textContent = "Login failed";
      messageDiv.style.color = "red";
      console.error("Error:", error);
    }
  });
</script>
