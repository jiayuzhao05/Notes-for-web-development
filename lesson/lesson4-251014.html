      //1.object example

      const objectDemo = {
        a: {
          prop1: "Hello",
          prop2: "羊先生",
        },
      };

      Object.freeze(objectDemo);
      // 顶层被冻结，但 a 仍可改。

      // 和是否为严格模式无关。 在非严格模式下，如果你尝试修改一个已冻结属性的值，操作会静默失败不会报错。在严格模式下，如果你尝试修改一个已冻结属性的值，JavaScript 会抛出 TypeError 错误。
      objectDemo.a.prop1 = "Hi"; // 生效（非严格冻结内层）

      // 深冻结：递归冻结所有层级
      function deepFreeze(obj) {
        Object.freeze(obj);
        Object.getOwnPropertyNames(obj).forEach((key) => {
          const value = obj[key];
          if (
            value &&
            (typeof value === "object" || typeof value === "function") &&
            !Object.isFrozen(value)
          ) {
            deepFreeze(value);
          }
        });
        return obj;
      }

      deepFreeze(objectDemo);
      // 内外都不能改
      // objectDemo.a.prop1 = 'Hi' // 严格模式下 TypeError
